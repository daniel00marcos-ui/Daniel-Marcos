<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cont de teclas</title>
</head>
<body>
    <h1>Contador de teclas presionadas</h1>

    <p>Teclas presionadas: <span id="contador">0</span></p>

    <p>Última tecla: <span id="ultimaTecla">Ninguna</span></p>   
    <script>
        const contador=document.getElementById('contador')
        const ultimaTecla=document.getElementById('ultimaTecla')

        let total=0

        document.addEventListener('keydown',function(event){
            total=total+1
            console.log('tecla presionada',total)
            contador.textContent=total
            ultimaTecla.textContent=event.key
        })
    </script> 
</body>
</html>
