<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS - Modelo de caja</title>
    <style>
        .caja{
            background-color: coral;

            width: 200px;
            height: 50px;

            border: 5px solid red;

            padding: 10px;
            margin: 10px;

            padding: 20px 10px 20px 10px;

            box-sizing: content-box;
            box-sizing: border-box;
        }

        .bloque{
            background-color: lightcoral;
            display: block;
        }
        .enlinea{
            background-color: lightgreen;
            display: inline;
        }
        .enlinea_bloque{
            background-color: lightpink;
            display: inline-block;
        }
    </style>
</head>
<body>
    <div class="caja">Modelo de caja</div>

    <div class="bloque">BLOQUE</div>
    <div class="enlinea">ENLINEA1</div>
    <div class="enlinea">ENLINEA2</div>
    <div class="enlinea_bloque">EN LINEA Y BLOQUE</div>


</body>
</html>
